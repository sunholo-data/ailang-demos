# Deploy Firestore security rules for the website-builder named database.
# Triggered by Cloud Build on push to main (or manually).
#
# Setup:
#   gcloud builds triggers create github \
#     --repo-name=demos --repo-owner=sunholo-data \
#     --branch-pattern='^main$' \
#     --included-files='website_builder/firestore.rules,website_builder/cloudbuild.yaml,firebase.json' \
#     --build-config=website_builder/cloudbuild.yaml \
#     --project=ailang-multivac-dev
#
# The default Cloud Build service account needs the Firebase Rules Admin role:
#   gcloud projects add-iam-policy-binding ailang-multivac-dev \
#     --member="serviceAccount:$(gcloud projects describe ailang-multivac-dev --format='value(projectNumber)')@cloudbuild.gserviceaccount.com" \
#     --role="roles/firebaserules.admin"

steps:
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only firestore:rules --project $PROJECT_ID --force
        echo "Firestore rules deployed to website-builder database"
