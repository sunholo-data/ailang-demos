# Deploy Firestore security rules for the website-builder named database.
# Triggered by Cloud Build on push to main (or manually).
#
# Rules are single-source (one firestore.rules file with no per-env variation),
# so we deploy to all three environments — dev, test, prod — in one build.
# This avoids the trap where prod silently lags dev because no release pipeline
# fans rules out (the Mouser/preview outage of 2026-04-08).
#
# Builds run in ailang-multivac-deploy, so $PROJECT_ID is the deploy project —
# NOT the target. Each target project's SA needs Firebase Rules Admin:
#   for P in ailang-multivac-dev ailang-multivac-test ailang-multivac; do
#     gcloud projects add-iam-policy-binding $P \
#       --member="serviceAccount:sa-cloudbuild@ailang-multivac-deploy.iam.gserviceaccount.com" \
#       --role="roles/firebaserules.admin"
#   done
#
# Trigger setup (in ailang-multivac-deploy):
#   gcloud builds triggers create github \
#     --project=ailang-multivac-deploy \
#     --region=europe-west3 \
#     --name=ailang-demos-firestore-rules \
#     --repository=projects/ailang-multivac-deploy/locations/europe-west3/connections/github/repositories/sunholo-data-ailang-demos \
#     --branch-pattern='^main$' \
#     --included-files='website_builder/firestore.rules,website_builder/cloudbuild.yaml,firebase.json' \
#     --build-config=website_builder/cloudbuild.yaml \
#     --service-account=projects/ailang-multivac-deploy/serviceAccounts/sa-cloudbuild@ailang-multivac-deploy.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        npm install -g firebase-tools
        # Named databases need --only firestore:<database-name>, NOT firestore:rules
        for TARGET in ailang-multivac-dev ailang-multivac-test ailang-multivac; do
          echo "── Deploying rules to $TARGET ──"
          firebase deploy --only firestore:website-builder --project "$TARGET" --force
        done
        echo "Firestore rules deployed to all environments (dev/test/prod)"
