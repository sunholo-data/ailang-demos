<!DOCTYPE html>
<html>
<head>
  <title>AILANG · LinkedIn OAuth</title>
  <style>
    :root {
      --bg: #fff8f1;
      --fg: #1f1a14;
      --muted: #6b5d4a;
      --accent: #e73c17;
      --accent-2: #c08015;
      --ok: #16a34a;
      --err: #dc2626;
      --panel: #fff;
      --line: #f1e7d6;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(231, 60, 23, 0.08);
      padding: 36px 40px;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      display: block;
    }
    .brand {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin: 0 0 4px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 22px;
      font-weight: 600;
    }
    h2 { margin: 12px 0 8px; font-size: 19px; }
    p { margin: 8px 0; line-height: 1.5; color: var(--muted); }
    .success { color: var(--ok); }
    .error { color: var(--err); }
    code, .code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .code {
      background: #f7f0e3;
      border: 1px solid var(--line);
      padding: 12px 14px;
      border-radius: 10px;
      word-break: break-all;
      margin: 16px 0;
      text-align: left;
    }
    .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 3px solid #f1e7d6;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint {
      font-size: 13px;
      color: var(--muted);
      margin-top: 18px;
    }
    .hint code { background: #f7f0e3; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/callback/ailang-logo.svg" alt="AILANG" class="logo">
    <p class="brand">AILANG · LinkedIn</p>
    <h1>OAuth2 Token Exchange</h1>
    <div id="status">
      <span class="spinner"></span><span>Processing authorization...</span>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const errorDesc = params.get('error_description');
    const statusEl = document.getElementById('status');

    function setHTML(html) { statusEl.innerHTML = html; }

    // Tell the local CLI we're done so it can stop the server.
    function signalDone(ok) {
      // Best-effort: ignore errors. The endpoint may not exist on older builds.
      fetch('/api/linkedin/scripts/oauth_server/markDone', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ args: [ok ? 'ok' : 'err'] })
      }).catch(() => {});
    }

    if (error) {
      setHTML(`
        <h2 class="error">OAuth Error</h2>
        <p><strong>${error}</strong></p>
        <p>${errorDesc || ''}</p>
      `);
      signalDone(false);
    } else if (code) {
      setHTML(`
        <span class="spinner"></span><span>Exchanging code for tokens…</span>
        <div class="code">${code.substring(0, 36)}…</div>
      `);

      fetch('/api/linkedin/scripts/oauth_server/exchangeCode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ args: [code] })
      })
      .then(r => r.json())
      .then(data => {
        if (data.result && data.result.includes('saved')) {
          setHTML(`
            <h2 class="success">✓ Authentication complete</h2>
            <p>${data.result}</p>
            <p class="hint">You can close this tab — the local server will shut down shortly.<br>
              Verify with <code>ailang-linkedin status</code></p>
          `);
          signalDone(true);
        } else {
          setHTML(`
            <h2 class="error">Token exchange failed</h2>
            <p>${data.result || data.error || JSON.stringify(data)}</p>
            <p>Code (copy for manual exchange):</p>
            <div class="code">${code}</div>
          `);
          signalDone(false);
        }
      })
      .catch(err => {
        setHTML(`
          <h2 class="error">Request failed</h2>
          <p>${err.message}</p>
          <p>Code (copy for manual exchange):</p>
          <div class="code">${code}</div>
        `);
        signalDone(false);
      });
    } else {
      setHTML(`
        <h2 class="error">No code</h2>
        <p>No authorization code found in the URL.</p>
      `);
    }
  </script>
</body>
</html>
