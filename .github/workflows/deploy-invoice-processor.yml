name: Deploy AILANG Demos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'wasm/**'
      - 'invoice_processor_wasm/**'
      - 'docparse/**'
      - 'ecommerce/**'
      - 'verify_demo/**'
      - 'streaming/**'
      - 'site/**'
      - 'website_builder/**'
      - '.github/workflows/deploy-invoice-processor.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run website builder server tests
        working-directory: website_builder/portal
        run: npm test

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AILANG WASM tarball
        run: |
          set -euo pipefail
          WASM_DIR="wasm"
          mkdir -p "$WASM_DIR"

          echo "::group::Fetching latest AILANG release info"
          RELEASE_JSON=$(curl -sfL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sunholo-data/ailang/releases/latest)
          RELEASE_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          echo "Latest release: $RELEASE_TAG"
          echo "::endgroup::"

          echo "::group::Downloading ailang-wasm.tar.gz"
          curl -sfL --retry 3 --retry-delay 5 \
            -o ailang-wasm.tar.gz \
            "https://github.com/sunholo-data/ailang/releases/download/${RELEASE_TAG}/ailang-wasm.tar.gz"
          echo "Tarball size: $(stat --printf='%s' ailang-wasm.tar.gz) bytes"
          echo "::endgroup::"

          echo "::group::Extracting tarball"
          tar -tzf ailang-wasm.tar.gz || { echo "::error::Tarball is corrupt"; exit 1; }
          tar -xzf ailang-wasm.tar.gz
          echo "Tarball contents:"
          tar -tzf ailang-wasm.tar.gz
          echo "::endgroup::"

          # Move ailang.wasm (required)
          if [ -f ailang.wasm ]; then
            mv ailang.wasm "$WASM_DIR/"
          else
            echo "::error::ailang.wasm not found in tarball"
            exit 1
          fi

          # Use wasm_exec.js from tarball if present, otherwise download from AILANG repo
          if [ -f wasm_exec.js ]; then
            echo "Using wasm_exec.js from release tarball"
            mv wasm_exec.js "$WASM_DIR/"
          else
            echo "wasm_exec.js not in tarball, downloading from AILANG repo..."
            curl -sfL --retry 3 --retry-delay 5 \
              -o "$WASM_DIR/wasm_exec.js" \
              "https://raw.githubusercontent.com/sunholo-data/ailang/${RELEASE_TAG}/docs/static/wasm/wasm_exec.js"
          fi

          # Use ailang-repl.js from tarball if present, otherwise download from AILANG repo
          if [ -f ailang-repl.js ]; then
            echo "Using ailang-repl.js from release tarball"
            mv ailang-repl.js "$WASM_DIR/"
          else
            echo "ailang-repl.js not in tarball, downloading from AILANG repo..."
            curl -sfL --retry 3 --retry-delay 5 \
              -o "$WASM_DIR/ailang-repl.js" \
              "https://raw.githubusercontent.com/sunholo-data/ailang/${RELEASE_TAG}/web/ailang-repl.js"
          fi

      - name: Verify WASM files
        run: |
          set -euo pipefail
          WASM_DIR="wasm"
          echo "::group::File listing"
          ls -lh "$WASM_DIR/"
          echo "::endgroup::"

          FAIL=0

          # ailang.wasm — should be >1MB (currently ~34MB)
          WASM_SIZE=$(stat --printf='%s' "$WASM_DIR/ailang.wasm")
          if [ "$WASM_SIZE" -lt 1000000 ]; then
            echo "::error::ailang.wasm is only ${WASM_SIZE} bytes (expected >1MB)"
            FAIL=1
          else
            echo "ailang.wasm: ${WASM_SIZE} bytes — OK"
          fi

          # wasm_exec.js — should be >10KB
          EXEC_SIZE=$(stat --printf='%s' "$WASM_DIR/wasm_exec.js")
          if [ "$EXEC_SIZE" -lt 10000 ]; then
            echo "::error::wasm_exec.js is only ${EXEC_SIZE} bytes (expected >10KB)"
            FAIL=1
          else
            echo "wasm_exec.js: ${EXEC_SIZE} bytes — OK"
          fi

          # ailang-repl.js — should be >3KB
          REPL_SIZE=$(stat --printf='%s' "$WASM_DIR/ailang-repl.js")
          if [ "$REPL_SIZE" -lt 3000 ]; then
            echo "::error::ailang-repl.js is only ${REPL_SIZE} bytes (expected >3KB)"
            FAIL=1
          else
            echo "ailang-repl.js: ${REPL_SIZE} bytes — OK"
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::WASM file verification failed"
            exit 1
          fi

          echo "All WASM files verified successfully"

      - name: Copy docparse modules
        run: |
          # Clean up any dev symlinks and set up real files for deployment
          rm -rf invoice_processor_wasm/ailang/docparse
          mkdir -p invoice_processor_wasm/ailang/docparse/types
          mkdir -p invoice_processor_wasm/ailang/docparse/services
          # Copy original source modules (single source of truth)
          cp docparse/types/document.ail invoice_processor_wasm/ailang/docparse/types/
          cp docparse/services/format_router.ail invoice_processor_wasm/ailang/docparse/services/
          cp docparse/services/zip_extract.ail invoice_processor_wasm/ailang/docparse/services/
          cp docparse/services/docx_parser.ail invoice_processor_wasm/ailang/docparse/services/
          cp docparse/services/pptx_parser.ail invoice_processor_wasm/ailang/docparse/services/
          cp docparse/services/xlsx_parser.ail invoice_processor_wasm/ailang/docparse/services/
          cp docparse/services/output_formatter.ail invoice_processor_wasm/ailang/docparse/services/
          cp docparse/services/docparse_browser.ail invoice_processor_wasm/ailang/docparse/services/
          echo "Copied $(find invoice_processor_wasm/ailang/docparse -name '*.ail' | wc -l) docparse modules"

      - name: Copy verify_demo modules
        run: |
          # Clean up any dev symlinks and set up real files for deployment
          rm -rf invoice_processor_wasm/ailang/verify_demo
          mkdir -p invoice_processor_wasm/ailang/verify_demo
          # Copy verification demo source modules
          cp verify_demo/verify_showcase.ail invoice_processor_wasm/ailang/verify_demo/
          cp verify_demo/billing.ail invoice_processor_wasm/ailang/verify_demo/
          cp verify_demo/access_policy.ail invoice_processor_wasm/ailang/verify_demo/
          cp verify_demo/scheduling.ail invoice_processor_wasm/ailang/verify_demo/
          cp verify_demo/main.ail invoice_processor_wasm/ailang/verify_demo/
          echo "Copied $(find invoice_processor_wasm/ailang/verify_demo -name '*.ail' | wc -l) verify_demo modules"

      - name: Install ailang CLI
        run: |
          set -euo pipefail
          # Reuse the same release tag the WASM tarball came from
          RELEASE_TAG=$(curl -sfL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sunholo-data/ailang/releases/latest \
            | jq -r '.tag_name')
          echo "Installing ailang ${RELEASE_TAG}"
          curl -sfL --retry 3 --retry-delay 5 \
            -o ailang-cli.tar.gz \
            "https://github.com/sunholo-data/ailang/releases/download/${RELEASE_TAG}/linux.x64.ailang.tar.gz"
          mkdir -p .ailang-cli && tar -xzf ailang-cli.tar.gz -C .ailang-cli
          # Locate the binary (tarball layout may vary) and put it on PATH
          AILANG_BIN=$(find .ailang-cli -type f -name ailang | head -1)
          if [ -z "$AILANG_BIN" ]; then
            echo "::error::ailang binary not found in tarball"
            tar -tzf ailang-cli.tar.gz
            exit 1
          fi
          install -m 0755 "$AILANG_BIN" /usr/local/bin/ailang
          ailang --version

      - name: Vendor AILANG package modules
        run: |
          # In CI, no local cache — download packages via ailang lock
          ailang lock
          scripts/vendor-wasm-packages.sh invoice_processor_wasm/ailang/pkg
          echo "Vendored $(find invoice_processor_wasm/ailang/pkg -name '*.ail' 2>/dev/null | wc -l) package modules"

      - name: Copy streaming modules
        run: |
          # Clean up dev symlinks (absolute paths, dangling in CI)
          rm -rf invoice_processor_wasm/ailang/streaming
          mkdir -p invoice_processor_wasm/ailang/streaming/gemini_live
          mkdir -p invoice_processor_wasm/ailang/streaming/claude_chat/types
          mkdir -p invoice_processor_wasm/ailang/streaming/claude_chat/services
          cp streaming/gemini_live/gemini_live_browser.ail \
            invoice_processor_wasm/ailang/streaming/gemini_live/
          cp streaming/claude_chat/types/claude_types.ail \
            invoice_processor_wasm/ailang/streaming/claude_chat/types/
          cp streaming/claude_chat/services/claude_sse.ail \
            invoice_processor_wasm/ailang/streaming/claude_chat/services/
          cp streaming/claude_chat/services/claude_chat_browser.ail \
            invoice_processor_wasm/ailang/streaming/claude_chat/services/
          # Safe Agent modules (contract-verified tools)
          mkdir -p invoice_processor_wasm/ailang/streaming/safe_agent/types
          mkdir -p invoice_processor_wasm/ailang/streaming/safe_agent/services
          cp streaming/safe_agent/types/agent_types.ail \
            invoice_processor_wasm/ailang/streaming/safe_agent/types/
          cp streaming/safe_agent/services/verified_tools.ail \
            invoice_processor_wasm/ailang/streaming/safe_agent/services/
          cp streaming/safe_agent/services/safe_agent_browser.ail \
            invoice_processor_wasm/ailang/streaming/safe_agent/services/
          cp streaming/safe_agent/services/business_tools.ail \
            invoice_processor_wasm/ailang/streaming/safe_agent/services/
          cp streaming/safe_agent/services/business_browser.ail \
            invoice_processor_wasm/ailang/streaming/safe_agent/services/
          # Ambient Assistant module (WASM bridge)
          mkdir -p invoice_processor_wasm/ailang/streaming/ambient_assistant
          cp streaming/ambient_assistant/ambient_browser.ail \
            invoice_processor_wasm/ailang/streaming/ambient_assistant/
          echo "Copied streaming modules"

      - name: Copy demo Office files
        run: |
          # Copy representative test files for demo buttons
          cp docparse/data/test_files/sample.docx invoice_processor_wasm/assets/
          cp docparse/data/test_files/tables.docx invoice_processor_wasm/assets/
          cp docparse/data/test_files/merged_cells.docx invoice_processor_wasm/assets/
          cp docparse/data/test_files/python_pptx_slides.pptx invoice_processor_wasm/assets/
          cp docparse/data/test_files/python_pptx_table.pptx invoice_processor_wasm/assets/
          cp docparse/data/test_files/pandoc_basic.pptx invoice_processor_wasm/assets/
          cp docparse/data/test_files/pandoc_basic.xlsx invoice_processor_wasm/assets/
          cp docparse/data/test_files/comments.docx invoice_processor_wasm/assets/
          cp docparse/data/test_files/track_changes_move.docx invoice_processor_wasm/assets/
          echo "Copied $(ls invoice_processor_wasm/assets/*.docx invoice_processor_wasm/assets/*.pptx invoice_processor_wasm/assets/*.xlsx 2>/dev/null | wc -l) demo Office files to assets/"

      - name: Build Website Builder portal
        env:
          # Prod Cloud Run service — matches the prod Firebase project the
          # portal authenticates against (M-SEC1 restricted key rotation).
          VITE_API_URL: https://ailang-website-builder-ao6kuhcibq-ew.a.run.app/api
        run: |
          cd website_builder/portal
          npm ci
          npm run build
          echo "Built website_builder/portal/dist:"
          ls -lh dist/

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Shared WASM runtime (used by all demos)
          # Copy individual files to avoid dangling symlinks from checkout
          mkdir -p _site/wasm
          cp wasm/ailang.wasm wasm/wasm_exec.js wasm/ailang-repl.js _site/wasm/

          # WASM demos (rename index.html → extractor.html)
          # Exclude wasm/ dir (shared runtime is top-level now)
          rsync -a --exclude='wasm/' invoice_processor_wasm/ _site/
          mv _site/index.html _site/extractor.html

          # Hub page + SVGs + shared CSS (AFTER rsync+rename so it doesn't get overwritten)
          cp site/index.html _site/
          cp site/*.svg _site/
          mkdir -p _site/shared
          cp site/shared/design-system.css _site/shared/

          # Demo-specific AILANG module alongside WASM runtime
          cp invoice_processor_wasm/wasm/invoice_processor.ail _site/wasm/

          # Ecommerce landing page + screenshot
          mkdir -p _site/ecommerce/img
          cp ecommerce/browser/index.html _site/ecommerce/
          cp ecommerce/img/ecommerce-dashboard-ui.png _site/ecommerce/img/
          # Streaming shared assets
          mkdir -p _site/streaming/shared
          cp streaming/shared/audio-worklet.js _site/streaming/shared/
          cp streaming/shared/gemini-live-core.js _site/streaming/shared/
          cp streaming/shared/streaming-ui.js _site/streaming/shared/
          cp streaming/shared/ailang-logo.svg _site/streaming/shared/
          cp site/shared/design-system.css _site/streaming/shared/
          cp streaming/index.html _site/streaming/

          # Streaming demos (each browser/index.html → streaming/<demo>/index.html)
          for demo in claude_chat gemini_live safe_agent voice_docparse ambient_assistant; do
            mkdir -p "_site/streaming/${demo}"
            cp "streaming/${demo}/browser/index.html" "_site/streaming/${demo}/"
          done

          # Streaming AILANG modules already copied via rsync from
          # invoice_processor_wasm/ailang/streaming/ (cleaned in earlier step)

          # DocParse hub page (document-intelligence/ to avoid confusion with docparse.html)
          mkdir -p _site/document-intelligence
          cp docparse/site/index.html _site/document-intelligence/

          # Website Builder portal (Vue SPA + WASM)
          mkdir -p _site/website_builder/wasm
          cp -r website_builder/portal/dist/* _site/website_builder/
          cp -r website_builder/portal/public/avatars _site/website_builder/avatars
          cp wasm/wasm_exec.js wasm/ailang-repl.js wasm/ailang.wasm _site/website_builder/wasm/
          # AILANG modules fetched at runtime from ailang/ (relative to portal root)
          mkdir -p _site/website_builder/ailang/website_builder/types
          mkdir -p _site/website_builder/ailang/website_builder/services
          cp website_builder/types/*.ail _site/website_builder/ailang/website_builder/types/
          cp website_builder/services/*.ail _site/website_builder/ailang/website_builder/services/
          # DocParse modules (used by website builder for document parsing)
          mkdir -p _site/website_builder/ailang/docparse/types
          mkdir -p _site/website_builder/ailang/docparse/services
          cp docparse/types/*.ail _site/website_builder/ailang/docparse/types/
          cp docparse/services/*.ail _site/website_builder/ailang/docparse/services/

          echo "::group::Site contents"
          find _site -type f | head -60 || true
          echo "::endgroup::"
          echo "Assembled $(find _site -type f | wc -l) files into _site/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
