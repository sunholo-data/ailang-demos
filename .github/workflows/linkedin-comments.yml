name: LinkedIn Comments — 3-Hourly Refresh

# Cron runs every 3 hours: fetches LinkedIn comments and runs the sketch pipeline.
#
# Frequency lowered from hourly to 3-hourly to stay under LinkedIn's
# per-member daily quota for socialActions/comments-GET_ALL (100/day per
# user token, confirmed in Developer Portal Analytics). Hourly × 2 posts
# = 48/day baseline left almost no headroom for manual `refresh` testing.
# 3-hourly × 2 posts = 16/day baseline, comfortable buffer for both
# automation and ad-hoc retries.
#
# Steps (each gated on the previous):
#   1. Fetch comments via ailang-linkedin → linkedin/data/comments.json
#   2. Detect "<url> #ailang-<topic>" pairs in new comments → sketch_queue.json
#   3. Dispatch queued sketches (Net + AI + FS + Process, daily budget cap)
#   4. Rebuild topic leaderboards + index pages
#   5. Commit + push all changed files; trigger deploy
#
# Step 4 (topics-rebuild) is idempotent and runs every hour, which subsumes
# the daily-snapshot requirement in linkedin/design/sketches.md §6.6.
#
# Secrets required:
#   LINKEDIN_CREDENTIALS_JSON — ~/.ailang/linkedin/credentials.json contents
#                               (access_token, refresh_token, client_id, ...)
#   OPENROUTER_API_KEY        — OpenRouter key for sketch dispatch.
#                               AILANG std/ai routes via openrouter/auto
#                               by default — OpenRouter picks the model.
#                               Override with SKETCH_AI_MODEL env if needed.
#                               (optional — if missing, dispatch step skips
#                                with a warning rather than failing the run)
#
# When the LinkedIn access token expires (~60 days), step 1 starts failing.
# Refresh by running `ailang-linkedin auth` locally and updating the secret.

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours on the hour, UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: write          # commit comments.json
  actions: write           # trigger the deploy workflow

concurrency:
  group: linkedin-comments
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN; we explicitly trigger the deploy
          # workflow at the end so we don't need a PAT to chain workflows.
          fetch-depth: 1

      - name: Install AILANG CLI
        run: |
          set -euo pipefail
          RELEASE_TAG=$(curl -sfL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sunholo-data/ailang/releases/latest \
            | jq -r '.tag_name')
          echo "Installing AILANG ${RELEASE_TAG}"
          curl -sfL --retry 3 --retry-delay 5 \
            -o ailang-cli.tar.gz \
            "https://github.com/sunholo-data/ailang/releases/download/${RELEASE_TAG}/linux.x64.ailang.tar.gz"
          mkdir -p .ailang-cli && tar -xzf ailang-cli.tar.gz -C .ailang-cli
          AILANG_BIN=$(find .ailang-cli -type f -name ailang | head -1)
          if [ -z "$AILANG_BIN" ]; then
            echo "::error::ailang binary not found in tarball"
            tar -tzf ailang-cli.tar.gz
            exit 1
          fi
          sudo install -m 0755 "$AILANG_BIN" /usr/local/bin/ailang
          ailang --version

      - name: Restore LinkedIn credentials
        env:
          CREDS_JSON: ${{ secrets.LINKEDIN_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${CREDS_JSON:-}" ]; then
            echo "::error::Secret LINKEDIN_CREDENTIALS_JSON is not set."
            echo "Run 'ailang-linkedin auth' locally, then add the contents of"
            echo "~/.ailang/linkedin/credentials.json as a repo secret named LINKEDIN_CREDENTIALS_JSON."
            exit 1
          fi
          mkdir -p "$HOME/.ailang/linkedin"
          printf '%s' "$CREDS_JSON" > "$HOME/.ailang/linkedin/credentials.json"
          chmod 600 "$HOME/.ailang/linkedin/credentials.json"
          # Validate it's JSON without leaking the token to logs
          jq -e '.access_token | length > 0' "$HOME/.ailang/linkedin/credentials.json" >/dev/null \
            || { echo "::error::Credentials JSON is malformed or missing access_token"; exit 1; }
          echo "Credentials restored."

      - name: Resolve AILANG package dependencies
        # Demos depend on sunholo/linkedin (and others) via ailang.toml — the
        # runner needs to fetch the package tarballs into ~/.ailang/cache/
        # before `ailang run` can resolve `pkg/sunholo/linkedin/*` imports.
        run: ailang lock

      - name: Install docparse (ailang-parse CLI)
        # Sketcher uses docparse for structured HTML/PDF/Office extraction
        # (docparse-first, AI-fallback). Without it the dispatch path still
        # works but extractionPath stays "ai-fallback" — docparse is strictly
        # an upgrade. v0.14.0 has the tolerant HTML5 parser that handles
        # production websites.
        run: |
          set -euo pipefail
          DOCPARSE_TAG=v0.15.0
          git clone --branch "$DOCPARSE_TAG" --depth 1 \
            https://github.com/sunholo-data/ailang-parse.git \
            /tmp/ailang-parse
          # docparse depends on registry packages too — resolve them in-place.
          (cd /tmp/ailang-parse && ailang lock)
          sudo ln -sf /tmp/ailang-parse/bin/docparse /usr/local/bin/docparse
          docparse --help >/dev/null && echo "docparse $DOCPARSE_TAG installed at $(which docparse)"

      - name: Fetch comments
        id: fetch
        run: |
          set -euo pipefail
          mkdir -p linkedin/data
          # Capture stdout (JSON) and stderr (diagnostics) separately so we can
          # tell apart a successful empty pull from a 401/network failure.
          if ! linkedin/ailang-linkedin comments --json > linkedin/data/comments.json.new 2> /tmp/comments.err; then
            echo "::error::ailang-linkedin comments --json failed:"
            cat /tmp/comments.err >&2
            # Likely token expired — surface that explicitly
            if grep -qi "401\|unauthor\|token\|expired" /tmp/comments.err; then
              echo "::error::LinkedIn token appears expired. Run 'ailang-linkedin auth' locally and update LINKEDIN_CREDENTIALS_JSON."
            fi
            exit 1
          fi
          # Sanity check: must be valid JSON. The shape is a feed —
          # top-level array of posts, each with a nested .comments[] —
          # so we count comments across all posts for the headline.
          jq -e 'type == "array"' linkedin/data/comments.json.new >/dev/null \
            || { echo "::error::Output is not a JSON array"; cat linkedin/data/comments.json.new; exit 1; }
          posts=$(jq 'length' linkedin/data/comments.json.new)
          new_count=$(jq '[.[] | (.comments | length)] | add // 0' linkedin/data/comments.json.new)

          # Don't wipe a populated page on a transient fetch. If the new
          # result has 0 comments but we ALREADY have some committed,
          # treat as transient (LinkedIn rate limit, partial outage,
          # etc.) and keep the existing file. Stale comments beat blank
          # comments on a public page.
          old_count=0
          if [ -f linkedin/data/comments.json ]; then
            old_count=$(jq '[.[] | (.comments | length)] | add // 0' linkedin/data/comments.json 2>/dev/null || echo 0)
          fi

          if [ "$new_count" -eq 0 ] && [ "$old_count" -gt 0 ]; then
            # Differentiate rate-limit (429) from other transient causes
            # with one direct probe against the comments endpoint. The
            # probe counts as ~1 API call so we only run it on the bad
            # path where we're already troubleshooting.
            first_urn=$(jq -r '.[0].urn // empty' linkedin/data/comments.json 2>/dev/null)
            probe_status=""
            if [ -n "$first_urn" ]; then
              urn_enc=$(printf '%s' "$first_urn" | jq -sRr @uri)
              token=$(jq -r '.access_token' "$HOME/.ailang/linkedin/credentials.json")
              probe_status=$(curl -sS -o /dev/null -w "%{http_code}" \
                "https://api.linkedin.com/v2/socialActions/${urn_enc}/comments" \
                -H "Authorization: Bearer ${token}" \
                -H "X-Restli-Protocol-Version: 2.0.0" 2>/dev/null || echo "000")
            fi
            case "$probe_status" in
              429)
                echo "::warning::LinkedIn rate-limited (HTTP 429) — daily socialActions/comments-GET_ALL quota reached for this member token (default 100/day). Resets at midnight UTC. Preserving cached $old_count comments. See https://www.linkedin.com/developers/apps → Analytics for current usage."
                ;;
              401|403)
                echo "::error::LinkedIn auth failed (HTTP $probe_status) — token may be expired. Run 'ailang-linkedin auth' locally and update LINKEDIN_CREDENTIALS_JSON."
                ;;
              200)
                echo "::warning::Fetch returned 0 comments but API probe was 200 — likely a transient empty result. Preserving cached $old_count."
                ;;
              *)
                echo "::warning::Fetch returned 0 comments (probe status: $probe_status). Preserving cached $old_count — likely transient."
                ;;
            esac
            rm -f linkedin/data/comments.json.new
            count=$old_count
          else
            mv linkedin/data/comments.json.new linkedin/data/comments.json
            count=$new_count
          fi

          echo "Fetched $count comment(s) across $posts post(s)"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Detect sketch requests in new comments
        id: detect
        # Scans linkedin/data/comments.json for "<url> #ailang-<topic>" pairs
        # and appends new entries to linkedin/data/sketch_queue.json.
        # Idempotent — dedups against existing queue entries.
        run: |
          set -euo pipefail
          DATE_STR=$(date -u +%Y-%m-%d)
          ./linkedin/ailang-linkedin sketch-detect "$DATE_STR" 2>&1 | tee /tmp/detect.out
          queue_count=0
          if [ -f linkedin/data/sketch_queue.json ]; then
            queue_count=$(jq 'length' linkedin/data/sketch_queue.json 2>/dev/null || echo 0)
          fi
          echo "queue_count=$queue_count" >> "$GITHUB_OUTPUT"

      - name: Dispatch sketches (drain queue, respecting budget)
        id: dispatch
        if: steps.detect.outputs.queue_count != '0'
        # Drains linkedin/data/sketch_queue.json, generating up to the daily
        # budget number of sketches. Each requires Net + AI (OpenRouter via
        # API key) + FS + Process effects. Tolerates docparse missing on
        # the runner — sketch_extract.ail falls back to AI-only extraction.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_X_TITLE: AILANG sketch generator
          OPENROUTER_HTTP_REFERER: https://www.sunholo.com/ailang-demos/linkedin/
          SKETCH_AI_MODEL: openrouter/auto
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::warning::OPENROUTER_API_KEY secret not set — skipping sketch dispatch."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATE_STR=$(date -u +%Y-%m-%d)
          ./linkedin/ailang-linkedin sketch-dispatch "$DATE_STR" 2>&1 | tee /tmp/dispatch.out
          generated=$(grep -oE 'dispatch summary: [0-9]+' /tmp/dispatch.out | grep -oE '[0-9]+' | head -1 || echo 0)
          echo "generated=$generated" >> "$GITHUB_OUTPUT"

      - name: Rebuild topic leaderboards + index pages
        id: topics
        # Reads every sketch.json under site/linkedin/topics/<topic>/,
        # sorts, writes leaderboard.json + topic index.html.
        # Idempotent and fast — no AI calls, just file I/O.
        run: |
          set -euo pipefail
          DATE_STR=$(date -u +%Y-%m-%d)
          ./linkedin/ailang-linkedin topics-rebuild "$DATE_STR" 2>&1 | tail -10

      - name: Commit & push if changed
        id: commit
        run: |
          set -euo pipefail
          # Stage comments + sketch artefacts. Untracked paths must be staged
          # explicitly — `git diff --quiet` alone misses them.
          git add linkedin/data/comments.json
          [ -f linkedin/data/sketch_queue.json ] && git add linkedin/data/sketch_queue.json || true
          [ -f linkedin/data/sketch_budget.json ] && git add linkedin/data/sketch_budget.json || true
          [ -f linkedin/data/sketch_history.json ] && git add linkedin/data/sketch_history.json || true
          [ -d site/linkedin/topics ] && git add site/linkedin/topics || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "ailang-linkedin-bot"
          git config user.email "noreply@sunholo.com"
          GEN="${{ steps.dispatch.outputs.generated || '0' }}"
          if [ "$GEN" -gt 0 ]; then
            HEADLINE="linkedin: refresh comments (${{ steps.fetch.outputs.count }} total) + ${GEN} new sketch(es)"
          else
            HEADLINE="linkedin: refresh comments (${{ steps.fetch.outputs.count }} total)"
          fi
          git commit -m "$HEADLINE" \
            -m "Auto-generated by linkedin-comments.yml at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger site redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-invoice-processor.yml --ref "${GITHUB_REF_NAME}"
          echo "Triggered deploy workflow."
